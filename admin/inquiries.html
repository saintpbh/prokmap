<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>문의 관리 - 선교사 관리 시스템</title>
    <link rel="stylesheet" href="css/admin.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>

<body>
    <header class="admin-header">
        <h1><i class="fas fa-globe"></i> 선교사 관리 시스템</h1>
        <div class="user-info">
            <span class="user-email" id="userEmail">loading...</span>
            <button id="logoutBtn" class="btn-logout"><i class="fas fa-sign-out-alt"></i> 로그아웃</button>
        </div>
    </header>

    <div class="admin-layout">
        <aside class="sidebar">
            <ul class="sidebar-menu">
                <li><a href="index.html"><i class="fas fa-chart-line"></i> 대시보드</a></li>
                <li><a href="missionaries.html"><i class="fas fa-users"></i> 선교사 관리</a></li>
                <li><a href="newsletters.html"><i class="fas fa-newspaper"></i> 뉴스레터 관리</a></li>
                <li><a href="prayers.html"><i class="fas fa-praying-hands"></i> 기도 제목</a></li>
                <li><a href="report-upload.html"><i class="fas fa-file-alt"></i> 소식 일괄 등록</a></li>
                <li><a href="prok-integration.html"><i class="fas fa-share-square"></i> 총회 게시판 업로드</a></li>
                <li><a href="alerts.html"><i class="fas fa-exclamation-triangle"></i> 긴급 알림 송출</a></li>
                <li><a href="supporters.html"><i class="fas fa-hand-holding-heart"></i> 후원자 관리</a></li>
                <li><a href="groups.html"><i class="fas fa-layer-group"></i> 그룹 관리</a></li>
                <li><a href="certificates.html"><i class="fas fa-certificate"></i> 증명서 발급</a></li>
                <li><a href="communications.html"><i class="fas fa-envelope"></i> 연락하기</a></li>
                <li><a href="inquiries.html" class="active"><i class="fas fa-question-circle"></i> 문의 관리</a></li>
                <li><a href="admins.html"><i class="fas fa-user-shield"></i> 관리 권한 설정</a></li>
            </ul>
        </aside>

        <main class="main-content">
            <div class="card">
                <div class="card-header">
                    <h3 class="card-title">💬 문의 관리</h3>
                    <div style="display: flex; gap: 10px;">
                        <select id="statusFilter" class="form-select" style="width: auto;">
                            <option value="all">전체</option>
                            <option value="pending">대기중</option>
                            <option value="forwarded">전달완료</option>
                            <option value="replied">답변완료</option>
                        </select>
                        <button id="refreshBtn" class="btn" style="background: #95a5a6; color: white;">
                            <i class="fas fa-sync-alt"></i> 새로고침
                        </button>
                    </div>
                </div>

                <div id="inquiriesContainer">
                    <div class="spinner"></div>
                </div>
            </div>

            <!-- 문의 상세 모달 -->
            <div id="inquiryDetailModal" class="modal" style="display: none;">
                <div class="modal-content" style="max-width: 600px;">
                    <div class="modal-header">
                        <h3>문의 상세</h3>
                        <button class="close-btn" onclick="closeInquiryDetail()">×</button>
                    </div>
                    <div class="modal-body" id="inquiryDetailContent">
                        <!-- 동적으로 채워짐 -->
                    </div>
                    <div class="modal-footer">
                        <button class="btn" style="background: #95a5a6; color: white;"
                            onclick="closeInquiryDetail()">닫기</button>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <script src="../js/firebase-config.js"></script>
    <script src="js/common.js"></script>

    <style>
        .inquiry-card {
            border: 1px solid #e5e7eb;
            border-radius: 8px;
            padding: 1rem;
            margin-bottom: 1rem;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .inquiry-card:hover {
            background: #f8f9fa;
            transform: translateY(-2px);
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .inquiry-header {
            display: flex;
            justify-content: space-between;
            align-items: start;
            margin-bottom: 0.75rem;
        }

        .inquiry-missionary {
            font-size: 16px;
            font-weight: 700;
            color: #1f2937;
        }

        .inquiry-status {
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 600;
        }

        .status-pending {
            background: #fef3c7;
            color: #92400e;
        }

        .status-forwarded {
            background: #dbeafe;
            color: #1e40af;
        }

        .status-replied {
            background: #d1fae5;
            color: #065f46;
        }

        .inquiry-sender {
            font-size: 14px;
            color: #6b7280;
            margin-bottom: 0.5rem;
        }

        .inquiry-message {
            font-size: 14px;
            color: #374151;
            line-height: 1.5;
            overflow: hidden;
            text-overflow: ellipsis;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
        }

        .inquiry-date {
            font-size: 12px;
            color: #9ca3af;
            margin-top: 0.5rem;
        }

        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .modal-content {
            background: white;
            border-radius: 12px;
            width: 90%;
            max-height: 90vh;
            overflow-y: auto;
        }

        .modal-header {
            padding: 1.5rem;
            border-bottom: 1px solid #e5e7eb;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .modal-header h3 {
            margin: 0;
        }

        .modal-body {
            padding: 1.5rem;
        }

        .modal-footer {
            padding: 1rem 1.5rem;
            border-top: 1px solid #e5e7eb;
            display: flex;
            justify-content: flex-end;
            gap: 0.5rem;
        }

        .close-btn {
            background: none;
            border: none;
            font-size: 24px;
            cursor: pointer;
            color: #6b7280;
        }

        .close-btn:hover {
            color: #1f2937;
        }

        .detail-row {
            margin-bottom: 1rem;
        }

        .detail-label {
            font-size: 12px;
            color: #6b7280;
            margin-bottom: 4px;
        }

        .detail-value {
            font-size: 14px;
            color: #1f2937;
        }
    </style>

    <script>
        let inquiries = [];
        let currentFilter = 'all';

        firebase.auth().onAuthStateChanged((user) => {
            if (user && adminAuth.allowedEmails.includes(user.email)) {
                setTimeout(initInquiryPage, 500);
            }
        });

        async function initInquiryPage() {
            await loadInquiries();

            // 필터 변경 이벤트
            document.getElementById('statusFilter').addEventListener('change', (e) => {
                currentFilter = e.target.value;
                displayInquiries();
            });

            // 새로고침 버튼
            document.getElementById('refreshBtn').addEventListener('click', loadInquiries);
        }

        async function loadInquiries() {
            const container = document.getElementById('inquiriesContainer');
            container.innerHTML = '<div class="spinner"></div>';

            try {
                const db = firebase.database();
                const snapshot = await db.ref('inquiries').once('value');
                const data = snapshot.val();

                if (!data) {
                    container.innerHTML = '<p style="text-align: center; color: #999; padding: 2rem;">문의가 없습니다.</p>';
                    return;
                }

                inquiries = Object.keys(data).map(key => ({
                    id: key,
                    ...data[key]
                })).sort((a, b) => new Date(b.timestamp) - new Date(a.timestamp));

                displayInquiries();
            } catch (error) {
                console.error('문의 로드 실패:', error);
                container.innerHTML = '<p style="text-align: center; color: #f00; padding: 2rem;">데이터 로드 실패</p>';
            }
        }

        function displayInquiries() {
            const container = document.getElementById('inquiriesContainer');
            let filtered = inquiries;

            if (currentFilter !== 'all') {
                filtered = inquiries.filter(i => i.status === currentFilter);
            }

            if (filtered.length === 0) {
                container.innerHTML = '<p style="text-align: center; color: #999; padding: 2rem;">해당하는 문의가 없습니다.</p>';
                return;
            }

            container.innerHTML = filtered.map(inquiry => `
                <div class="inquiry-card" onclick="showInquiryDetail('${inquiry.id}')">
                    <div class="inquiry-header">
                        <div>
                            <div class="inquiry-missionary">📧 ${inquiry.missionaryName} 선교사님</div>
                            <div class="inquiry-sender">
                                <i class="fas fa-user"></i> ${inquiry.senderName} (${inquiry.senderEmail})
                            </div>
                        </div>
                        <span class="inquiry-status status-${inquiry.status}">
                            ${getStatusText(inquiry.status)}
                        </span>
                    </div>
                    <div class="inquiry-message">${inquiry.message}</div>
                    <div class="inquiry-date">
                        <i class="fas fa-clock"></i> ${AdminUtils.formatDate(inquiry.timestamp)}
                    </div>
                </div>
            `).join('');
        }

        function getStatusText(status) {
            switch (status) {
                case 'pending': return '대기중';
                case 'forwarded': return '전달완료';
                case 'replied': return '답변완료';
                default: return status;
            }
        }

        function showInquiryDetail(id) {
            const inquiry = inquiries.find(i => i.id === id);
            if (!inquiry) return;

            const content = document.getElementById('inquiryDetailContent');
            content.innerHTML = `
                <div class="detail-row">
                    <div class="detail-label">선교사</div>
                    <div class="detail-value"><strong>${inquiry.missionaryName}</strong></div>
                </div>
                <div class="detail-row">
                    <div class="detail-label">문의자 이름</div>
                    <div class="detail-value">${inquiry.senderName}</div>
                </div>
                <div class="detail-row">
                    <div class="detail-label">문의자 이메일</div>
                    <div class="detail-value">${inquiry.senderEmail}</div>
                </div>
                <div class="detail-row">
                    <div class="detail-label">문의 일시</div>
                    <div class="detail-value">${AdminUtils.formatDate(inquiry.timestamp)}</div>
                </div>
                <div class="detail-row">
                    <div class="detail-label">상태</div>
                    <div class="detail-value">
                        <select id="statusSelect" class="form-select" style="width: auto;">
                            <option value="pending" ${inquiry.status === 'pending' ? 'selected' : ''}>대기중</option>
                            <option value="forwarded" ${inquiry.status === 'forwarded' ? 'selected' : ''}>전달완료</option>
                            <option value="replied" ${inquiry.status === 'replied' ? 'selected' : ''}>답변완료</option>
                        </select>
                    </div>
                </div>
                <div class="detail-row">
                    <div class="detail-label">문의 내용</div>
                    <div class="detail-value" style="white-space: pre-wrap; background: #f8f9fa; padding: 1rem; border-radius: 8px; margin-top: 8px;">
${inquiry.message}
                    </div>
                </div>
                <div style="margin-top: 1.5rem; display: flex; gap: 0.5rem;">
                    <button class="btn btn-primary" onclick="updateInquiryStatus('${id}')">
                        <i class="fas fa-save"></i> 상태 저장
                    </button>
                    <button class="btn" style="background: #3b82f6; color: white;" onclick="sendEmailToMissionary('${inquiry.missionaryId}', '${inquiry.missionaryName}')">
                        <i class="fas fa-paper-plane"></i> 선교사에게 전달 (준비 중)
                    </button>
                </div>
            `;

            document.getElementById('inquiryDetailModal').style.display = 'flex';
        }

        function closeInquiryDetail() {
            document.getElementById('inquiryDetailModal').style.display = 'none';
        }

        async function updateInquiryStatus(id) {
            const newStatus = document.getElementById('statusSelect').value;

            try {
                const db = firebase.database();
                await db.ref(`inquiries/${id}/status`).set(newStatus);

                AdminUtils.showToast('상태가 업데이트되었습니다.', 'success');
                closeInquiryDetail();
                await loadInquiries();
            } catch (error) {
                console.error('상태 업데이트 실패:', error);
                AdminUtils.showToast('상태 업데이트에 실패했습니다.', 'error');
            }
        }

        function sendEmailToMissionary(missionaryId, missionaryName) {
            alert(`이메일 발송 기능은 추후 구현 예정입니다.\n\n선교사: ${missionaryName}\n\n현재는 수동으로 선교사에게 문의를 전달해 주세요.`);
        }

        // 전역 함수로 등록
        window.closeInquiryDetail = closeInquiryDetail;
    </script>
</body>

</html>
