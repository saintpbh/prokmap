<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>문의 관리 - 선교사 관리 시스템</title>
    <link rel="stylesheet" href="css/admin.css">
    <link rel="stylesheet" href="css/modules/inquiry.css">
</head>

<body>
    <header class="admin-header">
        <h1><i class="fas fa-globe"></i> 선교사 관리 시스템</h1>
        <div class="user-info">
            <span class="user-email" id="userEmail">loading...</span>
            <button id="logoutBtn" class="btn-logout"><i class="fas fa-sign-out-alt"></i> 로그아웃</button>
        </div>
    </header>

    <div class="admin-layout">
        <aside class="sidebar">
            <ul class="sidebar-menu">
                <li><a href="index.html"><i class="fas fa-chart-line"></i> 대시보드</a></li>
                <li><a href="missionaries.html"><i class="fas fa-users"></i> 선교사 관리</a></li>
                <li><a href="newsletters.html"><i class="fas fa-newspaper"></i> 뉴스레터 관리</a></li>
                <li><a href="prayers.html"><i class="fas fa-praying-hands"></i> 기도 제목</a></li>
                <li><a href="report-upload.html"><i class="fas fa-file-alt"></i> 소식 일괄 등록</a></li>
                <li><a href="prok-integration.html"><i class="fas fa-share-square"></i> 총회 게시판 업로드</a></li>
                <li><a href="alerts.html"><i class="fas fa-exclamation-triangle"></i> 긴급 알림 송출</a></li>
                <li><a href="supporters.html"><i class="fas fa-hand-holding-heart"></i> 후원자 관리</a></li>
                <li><a href="groups.html"><i class="fas fa-layer-group"></i> 그룹 관리</a></li>
                <li><a href="certificates.html"><i class="fas fa-certificate"></i> 증명서 발급</a></li>
                <li><a href="communications.html"><i class="fas fa-envelope"></i> 연락하기</a></li>
                <li><a href="inquiries.html" class="active"><i class="fas fa-question-circle"></i> 문의 관리</a></li>
                <li><a href="admins.html"><i class="fas fa-user-shield"></i> 관리 권한 설정</a></li>
            </ul>
        </aside>

        <main class="main-content">
            <div class="card">
                <div class="card-header">
                    <h3 class="card-title">💬 문의 관리</h3>
                    <div style="display: flex; gap: 10px;">
                        <select id="statusFilter" class="form-select" style="width: auto;">
                            <option value="all">전체</option>
                            <option value="pending">대기중</option>
                            <option value="forwarded">전달완료</option>
                            <option value="replied">답변완료</option>
                        </select>
                        <button id="refreshBtn" class="btn" style="background: #95a5a6; color: white;">
                            <i class="fas fa-sync-alt"></i> 새로고침
                        </button>
                    </div>
                </div>

                <div id="inquiriesContainer">
                    <div class="spinner"></div>
                </div>
            </div>

            <!-- 문의 상세 모달 -->
            <div id="inquiryDetailModal" class="modal" style="display: none;">
                <div class="modal-content" style="max-width: 600px;">
                    <div class="modal-header">
                        <h3>문의 상세</h3>
                        <button class="modal-close">×</button>
                    </div>
                    <div class="modal-body" id="inquiryDetailContent">
                        <!-- 동적으로 채워짐 -->
                    </div>
                    <div class="modal-footer">
                        <button class="btn modal-close" style="background: #95a5a6; color: white;">닫기</button>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <script src="../js/firebase-config.js"></script>

    <!-- App Entry Point -->
    <script type="module" src="js/core/app-init.js"></script>
    <script type="module" src="js/modules/inquiry/main.js"></script>
</body>

</html>
