<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>연락하기 - 선교사 관리 시스템</title>
    <link rel="stylesheet" href="css/admin.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>

<body>
    <header class="admin-header">
        <h1><i class="fas fa-globe"></i> 선교사 관리 시스템</h1>
        <div class="user-info">
            <span class="user-email" id="userEmail">loading...</span>
            <button id="logoutBtn" class="btn-logout"><i class="fas fa-sign-out-alt"></i> 로그아웃</button>
        </div>
    </header>

    <div class="admin-layout">
        <aside class="sidebar">
            <ul class="sidebar-menu">
                <li><a href="index.html"><i class="fas fa-chart-line"></i> 대시보드</a></li>
                <li><a href="missionaries.html"><i class="fas fa-users"></i> 선교사 관리</a></li>
                <li><a href="newsletters.html"><i class="fas fa-newspaper"></i> 뉴스레터 관리</a></li>
                <li><a href="prayers.html"><i class="fas fa-praying-hands"></i> 기도 제목</a></li>
                <li><a href="report-upload.html"><i class="fas fa-file-alt"></i> 소식 일괄 등록</a></li>
                <li><a href="prok-integration.html"><i class="fas fa-share-square"></i> 총회 게시판 업로드</a></li>
                <li><a href="alerts.html"><i class="fas fa-exclamation-triangle"></i> 긴급 알림 송출</a></li>
                <li><a href="supporters.html"><i class="fas fa-hand-holding-heart"></i> 후원자 관리</a></li>
                <li><a href="groups.html"><i class="fas fa-layer-group"></i> 그룹 관리</a></li>
                <li><a href="certificates.html"><i class="fas fa-certificate"></i> 증명서 발급</a></li>
                <li><a href="communications.html" class="active"><i class="fas fa-envelope"></i> 연락하기</a></li>
                <li><a href="inquiries.html"><i class="fas fa-question-circle"></i> 문의 관리</a></li>
                <li><a href="admins.html"><i class="fas fa-user-shield"></i> 관리 권한 설정</a></li>
            </ul>
        </aside>

        <main class="main-content">
            <div class="card">
                <div class="card-header">
                    <h3 class="card-title">📧 그룹 연락하기</h3>
                </div>

                <div class="form-group">
                    <label class="form-label">그룹 선택 *</label>
                    <select id="groupSelect" class="form-select" multiple size="5">
                        <option value="all">전체 선교사</option>
                    </select>
                    <small style="color: #666;">Ctrl/Cmd 키를 누른 채로 여러 그룹을 선택할 수 있습니다.</small>
                </div>

                <div class="form-group">
                    <label class="form-label">연락 방법 *</label>
                    <div style="display: flex; gap: 20px;">
                        <label><input type="radio" name="contactMethod" value="email" checked> 📧 메일</label>
                        <label><input type="radio" name="contactMethod" value="kakao" disabled> 💬 카카오톡 (준비 중)</label>
                        <label><input type="radio" name="contactMethod" value="sms" disabled> 📱 문자 (준비 중)</label>
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label">제목 *</label>
                    <input type="text" id="messageSubject" class="form-input" placeholder="메시지 제목을 입력하세요">
                </div>

                <div class="form-group">
                    <label class="form-label">메시지 내용 *</label>
                    <textarea id="messageContent" class="form-textarea" rows="10"
                        placeholder="메시지 내용을 입력하세요..."></textarea>
                </div>

                <div class="form-group">
                    <div class="card" style="background: #f8f9fa; padding: 1rem;">
                        <strong>수신 대상</strong>
                        <p id="recipientCount" style="margin: 0.5rem 0 0 0; color: #666;">그룹을 선택하면 수신 대상이 표시됩니다.</p>
                    </div>
                </div>

                <div style="display: flex; gap: 1rem; margin-top: 2rem;">
                    <button id="previewBtn" class="btn" style="background: #95a5a6; color: white;">
                        <i class="fas fa-eye"></i> 미리보기
                    </button>
                    <button id="sendBtn" class="btn btn-primary">
                        <i class="fas fa-paper-plane"></i> 발송하기
                    </button>
                </div>
            </div>

            <!-- 발송 내역 -->
            <div class="card" style="margin-top: 2rem;">
                <div class="card-header">
                    <h3 class="card-title">📋 최근 발송 내역</h3>
                </div>
                <div id="communicationHistory">
                    <div class="spinner"></div>
                </div>
            </div>
        </main>
    </div>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <script src="../js/firebase-config.js"></script>

    <!-- EmailJS SDK (Optional) -->
    <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>

    <!-- App Entry Point -->
    <script type="module" src="js/core/app-init.js"></script>
    <script type="module" src="js/modules/communication/main.js"></script>
</body>

</html>
