<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>그룹 관리 - 선교사 관리 시스템</title>
    <link rel="stylesheet" href="css/admin.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>

<body>
    <header class="admin-header">
        <h1><i class="fas fa-globe"></i> 선교사 관리 시스템</h1>
        <div class="user-info">
            <span class="user-email" id="userEmail">loading...</span>
            <button id="logoutBtn" class="btn-logout"><i class="fas fa-sign-out-alt"></i> 로그아웃</button>
        </div>
    </header>

    <div class="admin-layout">
        <aside class="sidebar">
            <ul class="sidebar-menu">
                <li><a href="index.html"><i class="fas fa-chart-line"></i> 대시보드</a></li>
                <li><a href="missionaries.html"><i class="fas fa-users"></i> 선교사 관리</a></li>
                <li><a href="newsletters.html"><i class="fas fa-newspaper"></i> 뉴스레터 관리</a></li>
                <li><a href="prayers.html"><i class="fas fa-praying-hands"></i> 기도 제목</a></li>
                <li><a href="supporters.html"><i class="fas fa-hand-holding-heart"></i> 후원자 관리</a></li>
                <li><a href="groups.html" class="active"><i class="fas fa-layer-group"></i> 그룹 관리</a></li>
            </ul>
        </aside>

        <main class="main-content">
            <div class="card">
                <div class="card-header">
                    <h3 class="card-title">📁 선교사 그룹 관리</h3>
                    <button class="btn btn-primary" onclick="openAddGroupModal()">
                        <i class="fas fa-plus"></i> 그룹 생성
                    </button>
                </div>

                <div id="groupsList">
                    <div class="spinner"></div>
                </div>
            </div>
        </main>
    </div>

    <!-- Add Group Modal -->
    <div id="groupModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="groupModalTitle">그룹 생성</h3>
                <button class="modal-close">&times;</button>
            </div>
            <form id="groupForm">
                <input type="hidden" id="groupId">
                <div class="form-group">
                    <label class="form-label">그룹 이름 *</label>
                    <input type="text" id="groupName" class="form-input" required>
                </div>
                <div class="form-group">
                    <label class="form-label">설명</label>
                    <textarea id="groupDescription" class="form-textarea" rows="2"></textarea>
                </div>
                <div class="form-group">
                    <label class="form-label">그룹 멤버 선택</label>
                    <select id="groupMembers" class="form-select" multiple size="8">
                    </select>
                    <small style="color: #666;">Ctrl 키를 누른 채 클릭하여 여러 선교사를 선택</small>
                </div>
                <div style="display: flex; gap: 1rem; justify-content: flex-end; margin-top: 1.5rem;">
                    <button type="button" class="btn" onclick="AdminUtils.closeModal('groupModal')"
                        style="background: #95a5a6; color: white;">취소</button>
                    <button type="submit" class="btn btn-success"><i class="fas fa-save"></i> 저장</button>
                </div>
            </form>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <script src="../js/firebase-config.js"></script>
    <script src="js/common.js"></script>
    <script>
        let allGroups = [];
        let allMissionaries = [];

        firebase.auth().onAuthStateChanged((user) => {
            if (user && adminAuth.allowedEmails.includes(user.email)) {
                setTimeout(init, 500);
            }
        });

        async function init() {
            await Promise.all([loadGroups(), loadMissionaries()]);
            document.getElementById('groupForm').addEventListener('submit', saveGroup);
        }

        async function loadMissionaries() {
            allMissionaries = await firebaseDB.getMissionaries();
            const select = document.getElementById('groupMembers');
            select.innerHTML = allMissionaries.filter(m => m.isActive !== false)
                .map(m => `<option value="${m.id}">${m.name} (${m.country})</option>`).join('');
        }

        async function loadGroups() {
            const listEl = document.getElementById('groupsList');
            try {
                const snapshot = await firebase.database().ref('missionaryGroups').once('value');
                const data = snapshot.val();
                allGroups = data ? Object.keys(data).map(key => ({ id: key, ...data[key] })) : [];
                renderGroups();
            } catch (error) {
                AdminUtils.showError(listEl, '그룹을 불러올 수 없습니다.');
            }
        }

        function renderGroups() {
            const listEl = document.getElementById('groupsList');
            if (allGroups.length === 0) {
                listEl.innerHTML = '<p style="text-align: center; padding: 2rem; color: #999;">생성된 그룹이 없습니다.</p>';
                return;
            }
            listEl.innerHTML = allGroups.map(g => {
                const memberNames = (g.memberIds || []).map(id => {
                    const m = allMissionaries.find(missionary => missionary.id === id);
                    return m ? m.name : '알 수 없음';
                }).join(', ');
                return `
                    <div style="background: #f8f9fa; padding: 1.5rem; border-radius: 8px; margin-bottom: 1rem;">
                        <div style="display: flex; justify-content: space-between; align-items: start;">
                            <div style="flex: 1;">
                                <h4 style="margin: 0 0 0.5rem 0; color: var(--primary-color);">${g.name}</h4>
                                ${g.description ? `<p style="color: #666; margin: 0 0 0.5rem 0;">${g.description}</p>` : ''}
                                <p style="margin: 0; font-size: 0.9rem;"><strong>멤버 (${(g.memberIds || []).length}명):</strong> ${memberNames || '-'}</p>
                            </div>
                            <div style="display: flex; gap: 0.5rem;">
                                <button class="btn btn-primary" onclick="editGroup('${g.id}')" style="padding: 0.5rem 1rem;"><i class="fas fa-edit"></i></button>
                                <button class="btn btn-danger" onclick="deleteGroup('${g.id}', '${g.name}')" style="padding: 0.5rem 1rem;"><i class="fas fa-trash"></i></button>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function openAddGroupModal() {
            document.getElementById('groupModalTitle').textContent = '그룹 생성';
            document.getElementById('groupForm').reset();
            document.getElementById('groupId').value = '';
            AdminUtils.openModal('groupModal');
        }

        async function editGroup(id) {
            const group = allGroups.find(g => g.id === id);
            if (!group) return;
            document.getElementById('groupModalTitle').textContent = '그룹 수정';
            document.getElementById('groupId').value = id;
            document.getElementById('groupName').value = group.name || '';
            document.getElementById('groupDescription').value = group.description || '';
            const select = document.getElementById('groupMembers');
            Array.from(select.options).forEach(opt => {
                opt.selected = (group.memberIds || []).includes(opt.value);
            });
            AdminUtils.openModal('groupModal');
        }

        async function saveGroup(e) {
            e.preventDefault();
            const id = document.getElementById('groupId').value;
            const select = document.getElementById('groupMembers');
            const data = {
                name: document.getElementById('groupName').value.trim(),
                description: document.getElementById('groupDescription').value.trim(),
                memberIds: Array.from(select.selectedOptions).map(opt => opt.value),
                updatedAt: new Date().toISOString()
            };
            try {
                if (id) {
                    await firebase.database().ref(`missionaryGroups/${id}`).update(data);
                    AdminUtils.showToast('그룹이 수정되었습니다.', 'success');
                } else {
                    data.createdAt = new Date().toISOString();
                    await firebase.database().ref('missionaryGroups').push(data);
                    AdminUtils.showToast('그룹이 생성되었습니다.', 'success');
                }
                AdminUtils.closeModal('groupModal');
                await loadGroups();
            } catch (error) {
                AdminUtils.showToast('저장 중 오류가 발생했습니다.', 'error');
            }
        }

        async function deleteGroup(id, name) {
            if (!AdminUtils.confirm(`"${name}" 그룹을 삭제하시겠습니까?`)) return;
            try {
                await firebase.database().ref(`missionaryGroups/${id}`).remove();
                AdminUtils.showToast('그룹이 삭제되었습니다.', 'success');
                await loadGroups();
            } catch (error) {
                AdminUtils.showToast('삭제 중 오류가 발생했습니다.', 'error');
            }
        }
    </script>
</body>

</html>
