<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>그룹 관리 - 선교사 관리 시스템</title>
    <link rel="stylesheet" href="css/admin.css">
    <link rel="stylesheet" href="css/search-add.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>

<body>
    <header class="admin-header">
        <h1><i class="fas fa-globe"></i> 선교사 관리 시스템</h1>
        <div class="user-info">
            <span class="user-email" id="userEmail">loading...</span>
            <button id="logoutBtn" class="btn-logout"><i class="fas fa-sign-out-alt"></i> 로그아웃</button>
        </div>
    </header>

    <div class="admin-layout">
        <aside class="sidebar">
            <ul class="sidebar-menu">
                <li><a href="index.html"><i class="fas fa-chart-line"></i> 대시보드</a></li>
                <li><a href="missionaries.html"><i class="fas fa-users"></i> 선교사 관리</a></li>
                <li><a href="newsletters.html"><i class="fas fa-newspaper"></i> 뉴스레터 관리</a></li>
                <li><a href="prayers.html"><i class="fas fa-praying-hands"></i> 기도 제목</a></li>
                <li><a href="report-upload.html"><i class="fas fa-file-alt"></i> 소식 일괄 등록</a></li>
                <li><a href="prok-integration.html"><i class="fas fa-share-square"></i> 총회 게시판 업로드</a></li>
                <li><a href="alerts.html"><i class="fas fa-exclamation-triangle"></i> 긴급 알림 송출</a></li>
                <li><a href="supporters.html"><i class="fas fa-hand-holding-heart"></i> 후원자 관리</a></li>
                <li><a href="groups.html" class="active"><i class="fas fa-layer-group"></i> 그룹 관리</a></li>
                <li><a href="certificates.html"><i class="fas fa-certificate"></i> 증명서 발급</a></li>
                <li><a href="communications.html"><i class="fas fa-envelope"></i> 연락하기</a></li>
                <li><a href="inquiries.html"><i class="fas fa-question-circle"></i> 문의 관리</a></li>
                <li><a href="admins.html"><i class="fas fa-user-shield"></i> 관리 권한 설정</a></li>
            </ul>
        </aside>

        <main class="main-content">
            <div class="card">
                <div class="card-header">
                    <h3 class="card-title">📁 선교사 그룹 관리</h3>
                    <button class="btn btn-primary" onclick="openAddGroupModal()">
                        <i class="fas fa-plus"></i> 그룹 생성
                    </button>
                </div>

                <div id="groupsList">
                    <div class="spinner"></div>
                </div>
            </div>
        </main>
    </div>

    <!-- Add Group Modal -->
    <div id="groupModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="groupModalTitle">그룹 생성</h3>
                <button class="modal-close">&times;</button>
            </div>
            <form id="groupForm">
                <input type="hidden" id="groupId">
                <div class="form-group">
                    <label class="form-label">그룹 이름 *</label>
                    <input type="text" id="groupName" class="form-input" required>
                </div>
                <div class="form-group">
                    <label class="form-label">설명</label>
                    <textarea id="groupDescription" class="form-textarea" rows="2"></textarea>
                </div>
                <div class="form-group">
                    <label class="form-label">그룹 멤버 관리</label>
                    <div class="search-add-container">
                        <div id="selectedMembers" class="selected-items">
                            <!-- Selected items will appear here -->
                        </div>
                        <div class="search-input-wrapper">
                            <input type="text" id="memberSearchInput" class="form-input" placeholder="이름으로 검색하여 추가..."
                                autocomplete="off">
                            <div id="memberSearchResults" class="search-results-dropdown"></div>
                        </div>
                    </div>
                    <small style="color: #666; display: block; margin-top: 0.5rem;">이름을 검색하여 클릭하면 추가됩니다.</small>
                </div>
                <div style="display: flex; gap: 1rem; justify-content: flex-end; margin-top: 1.5rem;">
                    <button type="button" class="btn" onclick="AdminUtils.closeModal('groupModal')"
                        style="background: #95a5a6; color: white;">취소</button>
                    <button type="submit" class="btn btn-success"><i class="fas fa-save"></i> 저장</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <script src="../js/firebase-config.js"></script>

    <!-- App Entry Point -->
    <script type="module" src="js/core/app-init.js"></script>
    <script type="module" src="js/modules/group/main.js"></script>
</body>

</html>
