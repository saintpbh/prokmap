<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>관리 권한 설정 - 선교사 관리 시스템</title>
    <link rel="stylesheet" href="css/admin.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>

<body>
    <!-- Header -->
    <header class="admin-header">
        <h1><i class="fas fa-globe"></i> 선교사 관리 시스템</h1>
        <div class="user-info">
            <span class="user-email" id="userEmail">loading...</span>
            <button id="logoutBtn" class="btn-logout">
                <i class="fas fa-sign-out-alt"></i> 로그아웃
            </button>
        </div>
    </header>

    <!-- Main Layout -->
    <div class="admin-layout">
        <!-- Sidebar -->
        <aside class="sidebar">
            <ul class="sidebar-menu">
                <li><a href="index.html"><i class="fas fa-chart-line"></i> 대시보드</a></li>
                <li><a href="missionaries.html"><i class="fas fa-users"></i> 선교사 관리</a></li>
                <li><a href="newsletters.html"><i class="fas fa-newspaper"></i> 뉴스레터 관리</a></li>
                <li><a href="prayers.html"><i class="fas fa-praying-hands"></i> 기도 제목</a></li>
                <li><a href="report-upload.html"><i class="fas fa-file-alt"></i> 소식 일괄 등록</a></li>
                <li><a href="prok-integration.html"><i class="fas fa-share-square"></i> 총회 게시판 업로드</a></li>
                <li><a href="alerts.html"><i class="fas fa-exclamation-triangle"></i> 긴급 알림 송출</a></li>
                <li><a href="supporters.html"><i class="fas fa-hand-holding-heart"></i> 후원자 관리</a></li>
                <li><a href="groups.html"><i class="fas fa-layer-group"></i> 그룹 관리</a></li>
                <li><a href="certificates.html"><i class="fas fa-certificate"></i> 증명서 발급</a></li>
                <li><a href="communications.html"><i class="fas fa-envelope"></i> 연락하기</a></li>
                <li><a href="inquiries.html"><i class="fas fa-question-circle"></i> 문의 관리</a></li>
                <li><a href="admins.html" class="active"><i class="fas fa-user-shield"></i> 관리 권한 설정</a></li>
            </ul>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <div class="card">
                <div class="card-header">
                    <h3 class="card-title">🛡️ 관리 권한 설정</h3>
                    <button class="btn btn-primary" onclick="openAddAdminModal()">
                        <i class="fas fa-plus"></i> 관리자 추가
                    </button>
                </div>

                <div
                    style="margin-bottom: 1.5rem; padding: 1rem; background: #fff4e5; border-left: 4px solid #f39c12; border-radius: 4px;">
                    <p style="margin: 0; color: #856404; font-size: 0.95rem;">
                        <i class="fas fa-exclamation-circle"></i> <strong>주의:</strong> 관리자 이메일을 추가하면 해당 사용자는 모든 선교사 정보에
                        접근하고 수정할 수 있는 권한을 갖게 됩니다.
                    </p>
                </div>

                <!-- Table -->
                <div id="adminsTable">
                    <div class="spinner"></div>
                </div>
            </div>
        </main>
    </div>

    <!-- Add Admin Modal -->
    <div id="adminModal" class="modal">
        <div class="modal-content" style="max-width: 400px;">
            <div class="modal-header">
                <h3>관리자 추가</h3>
                <button class="modal-close">&times;</button>
            </div>
            <form id="adminForm" style="padding: 1rem;">
                <div class="form-group">
                    <label class="form-label">구글 이메일 계정 *</label>
                    <input type="email" id="adminEmail" class="form-input" placeholder="example@gmail.com" required>
                    <small style="color: #666; margin-top: 0.5rem; display: block;">구글 로그인이 가능한 이메일 주소를 입력해 주세요.</small>
                </div>
                <div style="display: flex; gap: 1rem; justify-content: flex-end; margin-top: 1.5rem;">
                    <button type="button" class="btn" onclick="AdminUtils.closeModal('adminModal')"
                        style="background: #95a5a6; color: white;">
                        취소
                    </button>
                    <button type="submit" class="btn btn-success">
                        <i class="fas fa-save"></i> 저장
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <script src="../js/firebase-config.js"></script>
    <script src="js/common.js"></script>
    <script src="js/admins.js"></script>
</body>

</html>
