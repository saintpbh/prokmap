<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>뉴스레터 관리 - 선교사 관리 시스템</title>
    <link rel="stylesheet" href="css/admin.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>

<body>
    <header class="admin-header">
        <h1><i class="fas fa-globe"></i> 선교사 관리 시스템</h1>
        <div class="user-info">
            <span class="user-email" id="userEmail">loading...</span>
            <button id="logoutBtn" class="btn-logout"><i class="fas fa-sign-out-alt"></i> 로그아웃</button>
        </div>
    </header>

    <div class="admin-layout">
        <aside class="sidebar">
            <ul class="sidebar-menu">
                <li><a href="index.html"><i class="fas fa-chart-line"></i> 대시보드</a></li>
                <li><a href="missionaries.html"><i class="fas fa-users"></i> 선교사 관리</a></li>
                <li><a href="newsletters.html" class="active"><i class="fas fa-newspaper"></i> 뉴스레터 관리</a></li>
                <li><a href="prayers.html"><i class="fas fa-praying-hands"></i> 기도 제목</a></li>
                <li><a href="report-upload.html"><i class="fas fa-file-alt"></i> 소식 일괄 등록</a></li>
                <li><a href="prok-integration.html"><i class="fas fa-share-square"></i> 총회 게시판 업로드</a></li>
                <li><a href="alerts.html"><i class="fas fa-exclamation-triangle"></i> 긴급 알림 송출</a></li>
                <li><a href="supporters.html"><i class="fas fa-hand-holding-heart"></i> 후원자 관리</a></li>
                <li><a href="groups.html"><i class="fas fa-layer-group"></i> 그룹 관리</a></li>
                <li><a href="certificates.html"><i class="fas fa-certificate"></i> 증명서 발급</a></li>
                <li><a href="communications.html"><i class="fas fa-envelope"></i> 연락하기</a></li>
                <li><a href="inquiries.html"><i class="fas fa-question-circle"></i> 문의 관리</a></li>
                <li><a href="admins.html"><i class="fas fa-user-shield"></i> 관리 권한 설정</a></li>
            </ul>
        </aside>

        <main class="main-content">
            <div class="card">
                <div class="card-header">
                    <h3 class="card-title">📰 뉴스레터 업로드</h3>
                </div>

                <div class="form-group" style="position: relative;">
                    <label class="form-label">선교사 검색 및 선택 *</label>
                    <input type="text" id="missionarySearch" class="form-input" placeholder="이름 또는 국가로 검색..."
                        autocomplete="off">
                    <input type="hidden" id="selectedMissionaryId">
                    <input type="hidden" id="selectedMissionaryName">

                    <div id="searchResults" class="search-results-dropdown">
                        <!-- Results will appear here -->
                    </div>

                    <div id="selectedDisplay" class="selected-display-box">
                        <span>선택됨: <span id="selectedNameText"></span></span>
                        <button onclick="resetSelection()" class="btn-reset-selection" title="선택 취소">✕</button>
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label">뉴스레터 제목</label>
                    <input type="text" id="newsletterTitle" class="form-input" placeholder="예: 2026년 1월 소식">
                </div>

                <div class="form-group">
                    <label class="form-label">요약 (기도 팝업용) *</label>
                    <textarea id="newsletterSummary" class="form-textarea" rows="3"
                        placeholder="짧은 요약을 입력하세요 (80자 이내 권장)" maxlength="200"></textarea>
                    <small style="color: #666;">이 요약은 기도 팝업에 표시됩니다</small>
                </div>

                <div class="form-group">
                    <label class="form-label">📷 사역사진 (최대 3장)</label>
                    <input type="file" id="ministryPhotos" class="form-input" accept="image/*" multiple>
                    <small style="color: #666;">선교사 상세 정보에 표시될 사역사진 3장까지 선택 가능</small>
                    <div id="ministryPhotosPreview"
                        style="display: flex; gap: 0.5rem; margin-top: 0.5rem; flex-wrap: wrap;"></div>
                </div>

                <div class="form-group">
                    <label class="form-label">PDF 파일 업로드</label>
                    <input type="file" id="pdfFile" class="form-input" accept=".pdf">
                    <small style="color: #666;">PDF 파일만 업로드 가능합니다</small>
                </div>

                <div style="display: flex; gap: 1rem; margin-top: 2rem;">
                    <button id="uploadBtn" class="btn btn-success">
                        <i class="fas fa-upload"></i> 업로드
                    </button>
                    <button class="btn" onclick="clearForm()" style="background: #95a5a6; color: white;">
                        초기화
                    </button>
                </div>
            </div>

            <div class="card" style="margin-top: 2rem;">
                <div class="card-header">
                    <h3 class="card-title">📋 업로드된 뉴스레터</h3>
                </div>
                <div id="newslettersList">
                    <div class="spinner"></div>
                </div>
            </div>
        </main>
    </div>

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-storage.js"></script>
    <script src="../js/firebase-config.js"></script>
    <!-- Core Initialization Module -->
    <script type="module" src="js/core/app-init.js"></script>

    <!-- Newsletter Management Module -->
    <script type="module" src="js/modules/newsletter/main.js"></script>
</body>

</html>
