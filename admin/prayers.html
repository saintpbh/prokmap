<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>기도 제목 관리 - 선교사 관리 시스템</title>
    <link rel="stylesheet" href="css/admin.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>

<body>
    <header class="admin-header">
        <h1><i class="fas fa-globe"></i> 선교사 관리 시스템</h1>
        <div class="user-info">
            <span class="user-email" id="userEmail">loading...</span>
            <button id="logoutBtn" class="btn-logout"><i class="fas fa-sign-out-alt"></i> 로그아웃</button>
        </div>
    </header>

    <div class="admin-layout">
        <aside class="sidebar">
            <ul class="sidebar-menu">
                <li><a href="index.html"><i class="fas fa-chart-line"></i> 대시보드</a></li>
                <li><a href="missionaries.html"><i class="fas fa-users"></i> 선교사 관리</a></li>
                <li><a href="newsletters.html"><i class="fas fa-newspaper"></i> 뉴스레터 관리</a></li>
                <li><a href="prayers.html" class="active"><i class="fas fa-praying-hands"></i> 기도 제목</a></li>
                <li><a href="supporters.html"><i class="fas fa-hand-holding-heart"></i> 후원자 관리</a></li>
            </ul>
        </aside>

        <main class="main-content">
            <div class="card">
                <div class="card-header">
                    <h3 class="card-title">🙏 기도 제목 관리</h3>
                </div>
                <div id="prayerTopicsList">
                    <div class="spinner"></div>
                </div>
            </div>
        </main>
    </div>

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <script src="../js/firebase-config.js"></script>
    <script src="js/common.js"></script>
    <script>
        firebase.auth().onAuthStateChanged((user) => {
            if (user && adminAuth.allowedEmails.includes(user.email)) {
                setTimeout(loadPrayerTopics, 500);
            }
        });

        async function loadPrayerTopics() {
            const listEl = document.getElementById('prayerTopicsList');
            try {
                const missionaries = await firebaseDB.getMissionaries();
                const withPrayer = missionaries.filter(m => m.prayerTopic || m.prayer);

                if (withPrayer.length === 0) {
                    listEl.innerHTML = '<p style="text-align: center; padding: 2rem; color: #999;">등록된 기도 제목이 없습니다.</p>';
                    return;
                }

                listEl.innerHTML = withPrayer.map(m => `
                    <div style="padding: 1rem; background: #f8f9fa; border-radius: 8px; margin-bottom: 1rem;">
                        <h4 style="margin: 0 0 0.5rem 0; color: var(--primary-color);">${m.name} (${m.country})</h4>
                        <p style="margin: 0.5rem 0; color: #666;"><strong>현재 기도 제목:</strong></p>
                        <p style="margin: 0; padding: 0.5rem; background: white; border-radius: 4px;">${m.prayerTopic || '-'}</p>
                        ${m.prayer ? `
                            <p style="margin: 0.5rem 0 0 0; color: #666;"><strong>기본 기도 요청:</strong></p>
                            <p style="margin: 0; padding: 0.5rem; background: white; border-radius: 4px;">${m.prayer}</p>
                        ` : ''}
                    </div>
                `).join('');
            } catch (error) {
                AdminUtils.showError(listEl, '데이터를 불러올 수 없습니다.');
            }
        }
    </script>
</body>

</html>
