<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>기도 제목 관리 - 선교사 관리 시스템</title>
    <link rel="stylesheet" href="css/admin.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>

<body>
    <header class="admin-header">
        <h1><i class="fas fa-globe"></i> 선교사 관리 시스템</h1>
        <div class="user-info">
            <span class="user-email" id="userEmail">loading...</span>
            <button id="logoutBtn" class="btn-logout"><i class="fas fa-sign-out-alt"></i> 로그아웃</button>
        </div>
    </header>

    <div class="admin-layout">
        <aside class="sidebar">
            <ul class="sidebar-menu">
                <li><a href="index.html"><i class="fas fa-chart-line"></i> 대시보드</a></li>
                <li><a href="missionaries.html"><i class="fas fa-users"></i> 선교사 관리</a></li>
                <li><a href="newsletters.html"><i class="fas fa-newspaper"></i> 뉴스레터 관리</a></li>
                <li><a href="prayers.html" class="active"><i class="fas fa-praying-hands"></i> 기도 제목</a></li>
                <li><a href="report-upload.html"><i class="fas fa-file-alt"></i> 소식 일괄 등록</a></li>
                <li><a href="prok-integration.html"><i class="fas fa-share-square"></i> 총회 게시판 업로드</a></li>
                <li><a href="alerts.html"><i class="fas fa-exclamation-triangle"></i> 긴급 알림 송출</a></li>
                <li><a href="supporters.html"><i class="fas fa-hand-holding-heart"></i> 후원자 관리</a></li>
                <li><a href="groups.html"><i class="fas fa-layer-group"></i> 그룹 관리</a></li>
                <li><a href="certificates.html"><i class="fas fa-certificate"></i> 증명서 발급</a></li>
                <li><a href="communications.html"><i class="fas fa-envelope"></i> 연락하기</a></li>
                <li><a href="inquiries.html"><i class="fas fa-question-circle"></i> 문의 관리</a></li>
                <li><a href="admins.html"><i class="fas fa-user-shield"></i> 관리 권한 설정</a></li>
            </ul>
        </aside>

        <main class="main-content">
            <div class="card">
                <div class="card-header" style="display: flex; justify-content: space-between; align-items: center;">
                    <h3 class="card-title">🙏 기도 제목 관리</h3>
                    <div class="search-box">
                        <input type="text" id="searchInput" class="search-input" placeholder="이름 또는 국가 검색..."
                            style="padding: 0.5rem; border: 1px solid #ddd; border-radius: 4px; width: 250px;">
                    </div>
                </div>
                <div id="prayerTopicsList">
                    <div class="spinner"></div>
                </div>
            </div>
        </main>
    </div>

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <script src="../js/firebase-config.js"></script>
    <script src="js/common.js"></script>
    <!-- Edit Modal -->
    <div id="editPrayerModal" class="modal">
        <div class="modal-content" style="max-width: 600px;">
            <div class="modal-header">
                <h3>기도 제목 수정</h3>
                <button class="modal-close" onclick="AdminUtils.closeModal('editPrayerModal')">&times;</button>
            </div>
            <form id="editPrayerForm">
                <input type="hidden" id="editId">
                <div class="form-group">
                    <label class="form-label" id="editNameDisplay"></label>
                </div>
                <!-- 맵 순환용 (Summary Prayer) -->
                <div class="form-group" style="background: #eef7ff; padding: 10px; border-radius: 5px;">
                    <label class="form-label">📌 맵 순환용 제목 (요약)</label>
                    <textarea id="editSummaryPrayer" class="form-textarea" rows="2"
                        placeholder="지도 말풍선에 짧게 표시될 내용을 입력하세요."></textarea>
                </div>
                <!-- 상세 정보창용 (Current Prayer Topic) -->
                <div class="form-group">
                    <label class="form-label">🙏 현재 기도 제목 (상세창)</label>
                    <textarea id="editPrayerTopic" class="form-textarea" rows="4"
                        placeholder="선교사 상세 정보창에 표시될 전체 기도제목을 입력하세요."></textarea>
                </div>
                <!-- 기도 요청 (기본) (Legacy prayer field) -->
                <div class="form-group">
                    <label class="form-label">🙏 기도 요청 (기본/상시)</label>
                    <textarea id="editPrayerBasic" class="form-textarea" rows="3"
                        placeholder="기본적으로 노출될 기도 제목을 입력하세요."></textarea>
                </div>
                <!-- 최근 소식 요약 (Summary field) -->
                <div class="form-group"
                    style="background: #fff8ee; padding: 10px; border-radius: 5px; border: 1px solid #ffe8cc;">
                    <label class="form-label">📰 최근 소식 요약</label>
                    <textarea id="editSummary" class="form-textarea" rows="3"
                        placeholder="뉴스레터나 사역 보고의 짧은 요약 내용을 입력하세요."></textarea>
                </div>
                <div style="text-align: right; margin-top: 1rem;">
                    <button type="button" class="btn" style="background:#ccc; color:#333;"
                        onclick="AdminUtils.closeModal('editPrayerModal')">취소</button>
                    <button type="submit" class="btn btn-primary">저장</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        firebase.auth().onAuthStateChanged((user) => {
            if (user && adminAuth.allowedEmails.includes(user.email)) {
                setTimeout(loadPrayerTopics, 500);
            }
        });

        let allMissionaries = [];

        async function loadPrayerTopics() {
            const listEl = document.getElementById('prayerTopicsList');
            try {
                if (allMissionaries.length === 0) {
                    allMissionaries = await firebaseDB.getMissionaries();
                    // Sort by name initially
                    allMissionaries.sort((a, b) => a.name.localeCompare(b.name));
                }

                renderList();

            } catch (error) {
                console.error(error);
                AdminUtils.showError(listEl, '데이터를 불러올 수 없습니다.');
            }
        }

        function renderList() {
            const listEl = document.getElementById('prayerTopicsList');
            const searchText = document.getElementById('searchInput').value.toLowerCase().trim();

            let filtered = allMissionaries;
            if (searchText) {
                filtered = allMissionaries.filter(m =>
                    m.name.toLowerCase().includes(searchText) ||
                    m.country.toLowerCase().includes(searchText)
                );
            } else {
                // If no search, maybe filtering to show only existing ones is better UX?
                // Or just show all? Request implies "Search to find and write".
                // Let's show all but prioritized? No, listing 500 people is slow.
                // Let's list those with PRAYERS first + logic.
                // But the user said "Search by name".
                // Optimization: If no search text, show only those WITH content top 50?
                // Or simply show all (pagination might be needed later).
                // Let's show all for now since it's "Admin".
            }

            if (filtered.length === 0) {
                listEl.innerHTML = '<p style="text-align: center; padding: 2rem; color: #999;">검색 결과가 없습니다.</p>';
                return;
            }

            listEl.innerHTML = filtered.map(m => {
                const hasSummaryP = m.summaryPrayer && m.summaryPrayer.trim();
                const hasTopic = m.prayerTopic && m.prayerTopic.trim();
                const hasBasic = m.prayer && m.prayer.trim();
                const hasSummary = m.summary && m.summary.trim();

                const isComplete = hasSummaryP && hasTopic && hasSummary;
                const statusColor = isComplete ? '#e3f2fd' : (hasSummaryP || hasTopic ? '#fff9db' : '#fff');
                const borderColor = isComplete ? '#2196f3' : (hasSummaryP || hasTopic ? '#fcc419' : '#eee');

                return `
                    <div style="padding: 1rem; background: ${statusColor}; border: 1px solid ${borderColor}; border-radius: 8px; margin-bottom: 1rem; cursor: pointer; transition: all 0.2s;"
                         onclick="openEditModal('${m.id}')" onmouseover="this.style.transform='translateY(-2px)';" onmouseout="this.style.transform='none';">
                        
                        <div style="display:flex; justify-content:space-between;">
                            <h4 style="margin: 0; color: #333;">${m.name} <small style="color:#666; font-weight:normal;">(${m.country})</small></h4>
                            ${isComplete ? '<span style="font-size:0.8em; color:blue;">작성완료</span>' : (hasSummaryP || hasTopic ? '<span style="font-size:0.8em; color:orange;">진행중</span>' : '<span style="font-size:0.8em; color:#999;">미작성</span>')}
                        </div>

                        ${hasSummaryP ? `<div style="margin-top:0.5rem; font-size:0.9em;"><strong>📌 요약:</strong> ${m.summaryPrayer.substring(0, 50)}${m.summaryPrayer.length > 50 ? '...' : ''}</div>` : ''}
                        ${hasTopic ? `<div style="margin-top:0.3rem; font-size:0.9em; color:#555;"><strong>🙏 제목:</strong> ${m.prayerTopic.substring(0, 50)}${m.prayerTopic.length > 50 ? '...' : ''}</div>` : ''}
                        ${hasSummary ? `<div style="margin-top:0.3rem; font-size:0.9em; color:#868e96;"><strong>📰 소식:</strong> ${m.summary.substring(0, 50)}${m.summary.length > 50 ? '...' : ''}</div>` : ''}
                    </div>
                `;
            }).join('');
        }

        document.getElementById('searchInput').addEventListener('input', renderList);

        function openEditModal(id) {
            const missionary = allMissionaries.find(m => m.id === id);
            if (!missionary) return;

            document.getElementById('editId').value = id;
            document.getElementById('editNameDisplay').textContent = `${missionary.name} 선교사님의 기도제목 수정`;
            document.getElementById('editSummaryPrayer').value = missionary.summaryPrayer || '';
            document.getElementById('editPrayerTopic').value = missionary.prayerTopic || '';
            document.getElementById('editPrayerBasic').value = missionary.prayer || '';
            document.getElementById('editSummary').value = missionary.summary || '';

            AdminUtils.openModal('editPrayerModal');
        }

        document.getElementById('editPrayerForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const id = document.getElementById('editId').value;
            const summaryPrayer = document.getElementById('editSummaryPrayer').value.trim();
            const prayerTopic = document.getElementById('editPrayerTopic').value.trim();
            const prayer = document.getElementById('editPrayerBasic').value.trim();
            const summary = document.getElementById('editSummary').value.trim();

            try {
                const btn = e.target.querySelector('button[type="submit"]');
                btn.textContent = '저장 중...';
                btn.disabled = true;

                await firebaseDB.updateMissionary(id, {
                    summaryPrayer: summaryPrayer,
                    prayerTopic: prayerTopic,
                    prayer: prayer,
                    summary: summary,
                    updatedAt: new Date().toISOString()
                });

                // Update local list
                const idx = allMissionaries.findIndex(m => m.id === id);
                if (idx !== -1) {
                    allMissionaries[idx].summaryPrayer = summaryPrayer;
                    allMissionaries[idx].prayerTopic = prayerTopic;
                    allMissionaries[idx].prayer = prayer;
                    allMissionaries[idx].summary = summary;
                    allMissionaries[idx].updatedAt = new Date().toISOString();
                }

                AdminUtils.showToast('기도 제목이 수정되었습니다.', 'success');
                AdminUtils.closeModal('editPrayerModal');
                renderList();

            } catch (error) {
                console.error('저장 실패:', error);
                AdminUtils.showToast('저장 중 오류가 발생했습니다.', 'error');
            } finally {
                const btn = e.target.querySelector('button[type="submit"]');
                btn.textContent = '저장';
                btn.disabled = false;
            }
        });
    </script>
</body>

</html>
